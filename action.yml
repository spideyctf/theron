name: Theron AI Security Scan
description: Scan a checked-out repository for AI and agentic security risks.
inputs:
  modules:
    description: Comma-separated modules to run.
    required: false
    default: ai,sast,sca,agentic
  output:
    description: SARIF output path.
    required: false
    default: theron.sarif
  include-experimental:
    description: Enable experimental rules.
    required: false
    default: "false"
  fail-on:
    description: "Optional severity threshold: critical, high, medium, or low."
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - shell: bash
      run: >-
        ai-sec-scan --local "$GITHUB_WORKSPACE" --modules "${{ inputs.modules }}"
        --format sarif --output "${{ inputs.output }}"
        ${{ inputs.include-experimental == 'true' && '--include-experimental' || '' }}
        ${{ inputs.fail-on != '' && format('--fail-on {0}', inputs.fail-on) || '' }}
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
    - shell: bash
      run: |
        echo "### Theron AI security scan" >> "$GITHUB_STEP_SUMMARY"
        echo "SARIF uploaded from \`${{ inputs.output }}\`. Report-only unless \`fail-on\` is set." >> "$GITHUB_STEP_SUMMARY"
