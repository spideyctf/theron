name: Theron AI Security Scan
description: Scan a checked-out repository for AI and agentic security risks.
inputs:
  modules:
    description: Comma-separated modules to run.
    required: false
    default: ai,sast,sca,agentic
  output:
    description: SARIF output path.
    required: false
    default: theron.sarif
  include-experimental:
    description: Enable experimental rules.
    required: false
    default: "false"
  fail-on:
    description: "Optional severity threshold: critical, high, medium, or low."
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - shell: bash
      id: scan
      continue-on-error: true
      env:
        THERON_MODULES: ${{ inputs.modules }}
        THERON_OUTPUT: ${{ inputs.output }}
        THERON_EXPERIMENTAL: ${{ inputs.include-experimental }}
        THERON_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(--local "$GITHUB_WORKSPACE" --modules "$THERON_MODULES" --format sarif --output "$THERON_OUTPUT")
        if [[ "$THERON_EXPERIMENTAL" == 'true' ]]; then args+=(--include-experimental); fi
        if [[ -n "$THERON_FAIL_ON" ]]; then args+=(--fail-on "$THERON_FAIL_ON"); fi
        ai-sec-scan "${args[@]}"
    - uses: github/codeql-action/upload-sarif@v3
      if: ${{ !cancelled() && hashFiles(inputs.output) != '' }}
      with:
        sarif_file: ${{ inputs.output }}
    - shell: bash
      if: ${{ !cancelled() }}
      env:
        THERON_SCAN_OUTCOME: ${{ steps.scan.outcome }}
      run: |
        echo "### Theron AI security scan" >> "$GITHUB_STEP_SUMMARY"
        echo "Scan outcome: $THERON_SCAN_OUTCOME. Report-only unless fail-on is set." >> "$GITHUB_STEP_SUMMARY"
        if [[ "$THERON_SCAN_OUTCOME" != 'success' ]]; then exit 1; fi
