[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theron"
version = "1.0.0"
description = "Open-source AI infrastructure security scanner with GitHub integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Aryaman Futane"}]
keywords = ["security", "ai", "llm", "sast", "sca", "sbom", "mcp", "agentic", "scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "cvss>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.28.0",
]
web = ["fastapi>=0.115.0", "uvicorn>=0.34.0"]

[project.scripts]
ai-sec-scan = "scanner.cli:main"
theron-web = "scanner.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.setuptools.package-data]
scanner = ["../rules/**/*.yaml"]

[tool.setuptools.data-files]
"ai-sec-scanner/rules/ai/v1" = ["rules/ai/v1/prompt_injection.yaml", "rules/ai/v1/secret_exposure.yaml", "rules/ai/v1/insecure_deployment.yaml", "rules/ai/v1/data_exfiltration.yaml"]
"ai-sec-scanner/rules/sast/v1" = ["rules/sast/v1/python.yaml", "rules/sast/v1/javascript.yaml", "rules/sast/v1/ai_taint.yaml"]
"ai-sec-scanner/rules/sca/v1" = ["rules/sca/v1/risky_packages.yaml"]
"ai-sec-scanner/rules/agentic/v1" = ["rules/agentic/v1/mcp_config.yaml", "rules/agentic/v1/skill_injection.yaml", "rules/agentic/v1/tool_poisoning.yaml", "rules/agentic/v1/hidden_injections.yaml", "rules/agentic/v1/agent_permissions.yaml"]
